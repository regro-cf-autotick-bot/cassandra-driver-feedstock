{% set name = "cassandra-driver" %}
{% set version = "3.30.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 0c6a3e1428f7c6a9aa6c944b9c47a37cd2cdbeb5b5a82d42c33afdd56f14e398
  patches:
    - disable-libev-windows.patch  # [win]

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.0                           # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - cython >=3.0
    - libev  # [not win]
    - tomli

  run:
    - python
    - deprecated >=1.3.1
    - geomet >=1.1
    - numpy
    - libev  # [not win]

test:
  requires:
    - pip
  imports:
    - cassandra
    - cassandra.cqlengine
    - cassandra.io
    - cassandra.numpy_parser  # [not win and python_impl == 'cpython']
  commands:
    - pip check

about:
  home: http://github.com/datastax/python-driver
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Python driver for Cassandra
  description: |
    A modern, feature-rich and highly-tunable Python client library for Apache Cassandra (2.1+)
    using exclusively Cassandra’s binary protocol and Cassandra Query Language v3.
  doc_url: http://datastax.github.io/python-driver/api/index.html
  dev_url: http://github.com/datastax/python-driver

extra:
  recipe-maintainers:
    - petercable
    - anirrudh
    - scopatz
    - xylar
